# Serves the built frontend and proxies API calls to the backend container.
server {
    listen 80;
    root /usr/share/nginx/html;

    # API routes → FastAPI backend
    location ~ ^/(upload|tree|file|explain|summary|chat|models|stats|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # LLM responses stream as Server-Sent Events: forward each token
        # immediately and allow long generations
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
